
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrioriEvent</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
      color: #888888;
      text-align: center;
    }

    p {
      font-size: 16px;
      padding: 20px;
    }

    a {
      color: #888888;
    }
  </style>
</head>

<body>
  <div>
    <p id="message">Otwieranie kalendarza...</p>
    <a id="open" href="#" style="display:none">
      Otwórz kalendarz
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const date = params.get("date");

    const message = document.getElementById("message");
    const button = document.getElementById("open");

    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      message.textContent = "Nieprawidłowa data.";
    } else {
      const parsed = new Date(date + "T12:00:00Z");

      if (parsed.toISOString().slice(0, 10) !== date) {
        message.textContent = "Nieprawidłowa data.";
      } else {
        const [year, month, day] = date.split("-");

        message.textContent =
          `Otwieranie kalendarza dla daty: ${day}.${month}.${year}`;

        const shortcutURL =
          "shortcuts://run-shortcut?name=PrioriEvent&input=text&text=" +
          encodeURIComponent("D " + date);

        button.href = shortcutURL;
        button.style.display = "inline";

        setTimeout(() => {
          window.location.href = shortcutURL;
        }, 500);
      }
    }
  </script>
</body>
</html>
